    </style>
    <h1>The overtime beneath the payroll</h1>
    <p class="sub">New York City pays 285,080 active workers. Raise each borough by what it spends and the picture looks one way. Raise it by overtime and it looks very different.</p>
    <div class="chips" role="group" aria-label="Metric Selection"></div>
    <div class="grid">
      <div>
        <div class="stage">
          <svg class="map" viewBox="0 0 640 540" role="group" aria-label="Tilted map of the five boroughs, each a stack of cash raised by the chosen value"></svg>
          <div class="legend"><span>low</span><div class="ramp"></div><span class="max">high</span></div>
        </div>
        <p class="note">Source: NYC Citywide Payroll Data, fiscal year 2025, cleaned to 285,080 active workers.</p>
      </div>
      <div>
        <div class="card guide"></div>
        <div class="card detail"></div>
      </div>
    </div>
    </div>`;

      const q = s => root.querySelector(s);

      // The 5 rectangular metric buttons in one row
      const chips = d3.select(root).select(".chips").selectAll("button").data(Object.keys(M)).join("button")
        .attr("type", "button").text(k => M[k].label)
        .on("click", (e, k) => { metric = k; draw(reduce ? 0 : 650); });

      // Map: each borough is a stack of "bills" with NYC color grading
      const svg = d3.select(q("svg.map"));
      const bs = svg.append("g").selectAll("g").data(data, d => d.id).join("g").attr("class", "b")
        .attr("tabindex", 0).attr("role", "button").attr("aria-label", d => d.name)
        .on("mouseenter", (e, d) => { hover = d.id; paint(); })
        .on("mouseleave", () => { hover = null; paint(); })
        .on("click", (e, d) => toggle(d.id))
        .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(d.id); } });
      bs.each(function (d) {
        const g = d3.select(this);
        g.append("g").attr("class", "side").selectAll("path").data(d3.range(LAYERS)).join("path").attr("d", d.path);
        g.append("path").attr("class", "top").attr("d", d.path);
        g.append("text").attr("class", "buck").text("$");
      });
      const lbl = svg.append("g").style("pointer-events", "none").selectAll("text").data(data).join("text").attr("class", "lbl");
      lbl.append("tspan").attr("x", 0).text(d => d.name);
      const lv = lbl.append("tspan").attr("class", "v").attr("x", 0).attr("dy", "1.2em");

      // Drag to spin the map
      svg.call(d3.drag().on("drag", e => { angle += e.dx * 0.4; draw(0); }));

      function toggle(id) { sel = sel === id ? null : id; paint(); }

      function draw(dur) {
        const m = M[metric], max = d3.max(data, m.f);
        const hs = d3.scaleLinear().domain([0, max]).range([3, HMAX]);
        const cs = d3.scaleLinear().domain([0, max * 0.55, max]).range(["#1a476b", "#f5b800", "#ff5500"]).interpolate(d3.interpolateRgb);
        const a = angle * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
        const scr = (x, y) => { const u = x - MX, v = y - MY; return [CX + K * (u * c - v * s), CY + K * TILT * (u * s + v * c)]; };
        const T = l => `translate(${CX},${CY - l}) scale(${K},${K * TILT}) rotate(${angle}) translate(${-MX},${-MY})`;
        const tr = z => dur ? z.transition().duration(dur).ease(d3.easeCubicOut) : z.interrupt();

        bs.sort((p, r) => scr(p.labelX, p.labelY)[1] - scr(r.labelX, r.labelY)[1]);
        bs.each(function (d) {
          const v = m.f(d), h = hs(v), fill = cs(v), g = d3.select(this);
          const dark = d3.color(fill).darker(1.1).formatHex(), light = d3.color(fill).darker(0.35).formatHex();
          const band = i => Math.floor(i / 2) % 2 ? light : dark;
          tr(g.selectAll(".side path")).attr("transform", (_, i) => T(h * i / LAYERS))
            .attr("fill", (_, i) => band(i)).attr("stroke", (_, i) => band(i)).attr("stroke-width", 0.8);
          tr(g.select(".top")).attr("transform", T(h)).attr("fill", fill);
          tr(g.select(".buck")).attr("transform", `${T(h)} translate(${d.labelX},${d.labelY})`);
        });
        tr(lbl).attr("transform", d => { const [x, y] = scr(d.labelX, d.labelY); return `translate(${x},${y - hs(m.f(d)) - 18})`; });
        lv.text(d => m.fmt(m.f(d)));
        q(".max").textContent = m.fmt(max);
        chips.attr("aria-pressed", k => k === metric);
        paint();
      }

      // Cash-stack icon: rectangular banknote bundle
      function stackIcon(n) {
        const H = 16 + (n - 1) * 7;
        let out = `<svg width="58" height="${H + 4}" viewBox="0 0 58 ${H + 4}" aria-hidden="true">`;
        for (let i = 0; i < n; i++) {
          const y = H - 16 - i * 7 + 2, top = i === n - 1;
          out += `<rect x="1" y="${y}" width="56" height="16" rx="2" fill="${i % 2 ? "#34a853" : "#238636"}" stroke="#134e23" stroke-width="1"/>`;
          if (top) out += `<circle cx="29" cy="${y + 8}" r="5" fill="none" stroke="#e8f5ea" stroke-width="1.2"/><text x="29" y="${y + 11.5}" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#e8f5ea">$</text>`;
        }
        return out + "</svg>";
      }

      function paint() {
        const shown = hover || sel;
        bs.classed("sel", d => d.id === sel).style("opacity", d => !shown || d.id === shown ? 1 : 0.35);
        bs.attr("aria-pressed", d => d.id === sel);
        detail(shown ? data.find(d => d.id === shown) : null);
        guide();
      }

      function detail(d) {
        const el = q(".detail"), m = M[metric];
        if (!d) {
          el.innerHTML = `<h2>All five boroughs</h2>
            <p><b>285,080</b> active workers. <b>$27.2B</b> in total payroll. <b>$2.43B</b> of it overtime, across 34.5 million hours.</p>
            <p style="margin:0">1,009 employees earned more in overtime than their entire base salary.</p>`;
          return;
        }
        const max = d3.max(data, m.f), v = m.f(d), bills = Math.max(1, Math.round(v / max * 6));
        const w = x => (x / 125000 * 100).toFixed(1);
        el.innerHTML = `<h2>${d.name}</h2><div style="color:var(--mut)">${d.count.toLocaleString()} active workers</div>
          <div class="money">${stackIcon(bills)}<div><div class="big">${m.fmt(v)}</div><div style="color:var(--mut)">${m.label}</div></div></div>
          <dl><dt>Overtime paid</dt><dd>$${d.otPaidM}M</dd>
          <dt>Overtime share of payroll</dt><dd>${d.otSharePct}%</dd>
          <dt>Staff with any overtime</dt><dd>${d.pctOT}%</dd>
          <dt>Median overtime hours</dt><dd>${d.medianOTHours}</dd>
          <dt>Overtime beats base salary</dt><dd style="color:var(--ferry);font-weight:700;">${d.otExceedsBase} staff</dd>
          <dt>Top overtime agency</dt><dd>${d.topAgency}</dd>
          <dt>Top overtime title</dt><dd>${d.topTitle}</dd></dl>
          <div class="pay"><div>Median base salary: <b>$${d.medianBase.toLocaleString()}</b></div>
          <div class="bar" style="width:${w(d.medianBase)}%;background:var(--muni)"></div>
          <div>Average take-home: <b>$${d.avgTakeHome.toLocaleString()}</b></div>
          <div class="bar" style="width:${w(d.avgTakeHome)}%;background:var(--taxi)"></div></div>`;
      }

      function guide() {
        const el = q(".guide");
        if (ti < 0) {
          el.innerHTML = `<div class="row"><button class="solid" type="button">Take the 4-step tour</button></div>`;
          el.querySelector("button").onclick = () => step(0);
          return;
        }
        const s = tour[ti];
        el.innerHTML = `<h2>${s.t}</h2><p>${s.p}</p>
          <div class="row"><span class="step">Step ${ti + 1} of ${tour.length}</span>
          <button class="bk" type="button" ${ti ? "" : "disabled"}>Back</button>
          <button class="solid nx" type="button">${ti < tour.length - 1 ? "Next" : "Finish"}</button></div>`;
        el.querySelector(".bk").onclick = () => step(ti - 1);
        el.querySelector(".nx").onclick = () => ti < tour.length - 1 ? step(ti + 1) : (ti = -1, sel = null, paint());
      }

      function step(i) { ti = i; metric = tour[i].m; sel = tour[i].s; draw(reduce ? 0 : 650); }

      draw(0);
      return root;
    }
  </script>
