<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYC Visualization</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #1b2129; /* Dark background matching your 3D visual */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>

  <div id="observablehq"></div>

  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    // Replace <your-observable-username> with your actual Observable username/handle
    import define from "https://api.observablehq.com/@weareveryawesom/midterm.js?v=4";

    new Runtime().module(define, Inspector.into("#observablehq"));
  </script>

</body>
</html>
